<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <!-- jekyll-seo-tag adds meta description, canonical URL, Open Graph,
       Twitter card, and JSON-LD tags. title=false keeps the hand-rolled
       <title> above (already includes the full page-specific title) instead
       of seo-tag's own "Page | Site" format. Note: canonical/OG URLs are
       only fully correct once _config.yml's `url` is set to a real domain
       (currently empty -- see A4 review notes). -->
  {% seo title=false %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl | prepend: site.url}}">

{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

</head>
