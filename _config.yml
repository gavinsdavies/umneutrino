# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: "UM Neutrino Research Group"
email: gavin.s.davies@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Neutrino physics research at the University of Mississippi.
baseurl: ""
url: "https://umneutrino.org"
author: "Dr. Gavin S. Davies"
keywords: "neutrino, physics, NOvA, DUNE, EMPHATIC, particle physics"
timezone: "America/Chicago"

include:
  - _pages

sass:
  sass_dir: _sass

# NOTE(review, Aug 2026): a "collections" block for news/publications/team
# used to live here, but no _news/_publications/_team directories exist --
# all of that content is driven by _data/*.yml instead, so the collections
# config produced empty, unused collections. Removed rather than left as
# dead config; re-add if this content ever actually moves into collections.

# Plugins
# NOTE(review, Aug 2026): jekyll-paginate, jekyll-archives, and
# jekyll-redirect-from were listed here but never configured or used
# anywhere in the templates (no `paginate:` key, no archives config, no
# redirect_from front matter), so they silently did nothing. Removed from
# the active plugin list; the gems are still in the Gemfile if one of
# these features is wanted later.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
# Development settings
livereload: true
livereload_port: 35729
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
